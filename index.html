<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trip Profit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--mint:#3EE0A8;--mint-soft:rgba(62,224,168,0.12);--bg:#0B0B0B;--card:#151515;--line:#262626;--line2:#2c2c2c;--txt:#F2F2F2;--mut:#9a9a9a;--red:#E5484D;--red2:#F2797C;--red3:#F6A5A7;--gold:#F5C542;--cyan:#4FD8E0;--amber:#F2A33A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding:12px 12px 84px;max-width:520px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0}
h3{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 6px}
button{font-family:inherit;cursor:pointer}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr h1{flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:50%;background:var(--mint);color:#0B0B0B;display:flex;align-items:center;justify-content:center;flex:none}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.lbtn{height:32px;padding:0 10px;border-radius:16px;background:var(--card);border:1px solid var(--line2);color:var(--mut);font-size:13px;display:flex;align-items:center;gap:5px;flex:none}
.lbtn b{font-weight:500}
.lbtn b.on{color:var(--mint);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;margin-bottom:10px}
.f label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut);margin:0 0 3px;line-height:1.2}
.ic{display:inline-flex;flex:none}
.ic svg{width:14px;height:14px;stroke:#65DDB1;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.big svg{width:17px;height:17px}
.f input,.f select{width:100%;height:40px;background:var(--card);border:1px solid var(--line2);color:#fff;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;color-scheme:dark}
.f select{padding:0 6px}
.f input:focus,.f select:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 2px rgba(62,224,168,0.25)}
.f input:disabled,.f select:disabled{opacity:.55}
.f.full{grid-column:1 / -1}
.route{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.cnt{display:flex;align-items:center;height:40px;background:var(--card);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.cnt button{width:40px;height:100%;background:transparent;border:none;color:var(--mint);font-size:22px;line-height:1;padding:0}
.cnt button:active{background:#1f1f1f}
.cnt button:disabled{color:#444;cursor:default}
.cnt span{flex:1;text-align:center;font-size:16px;font-weight:600}
.err{font-size:12px;color:var(--red2);margin-top:4px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.card h3.hh{display:flex;align-items:center;gap:6px;color:var(--txt);font-size:14px;font-weight:600;margin:0 0 8px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0;font-size:14px}
.rw > span:last-child{font-weight:500;text-align:right}
.rw .lb{display:flex;align-items:center;gap:6px}
.rw.tot{border-top:1px solid var(--line2);margin-top:3px;padding-top:7px}
.pbox{margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--mint-soft);display:flex;justify-content:space-between;align-items:baseline}
.pbox .lbl{font-size:14px;display:flex;align-items:center;gap:6px}
.rpm2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rpm2 .rtile{background:#1b1b1b;border-radius:10px;padding:7px 10px}
.rpm2 .k{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.rpm2 .n{font-size:20px;font-weight:600;margin-top:1px}
.goalrow{display:flex;gap:6px;align-items:center}
.goalrow input{width:92px;flex:none}
.seg{display:flex;gap:5px;flex:1;min-width:0}
.seg button{flex:1;min-width:0;height:40px;font-size:12px;background:transparent;border:1px solid var(--line2);color:#b5b5b5;border-radius:10px;padding:0 4px;white-space:nowrap}
.seg button.on{background:var(--mint);color:#0B0B0B;border-color:var(--mint);font-weight:600}
.pbox .big{font-size:22px;font-weight:600;color:var(--mint)}
.note{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.4}
.btn-m{width:100%;height:46px;background:var(--mint);color:#0B0B0B;border:none;border-radius:12px;font-size:16px;font-weight:600}
.btn-m:active{opacity:.85}
.btn-m:disabled{opacity:.4;cursor:default}
.btn-m.done{background:#1c3a30;color:var(--mint)}
.btn-g{width:100%;height:40px;background:transparent;color:#b5b5b5;border:1px solid var(--line2);border-radius:12px;font-size:14px}
.btn-d{width:100%;height:44px;background:transparent;color:var(--red2);border:1px solid rgba(242,121,124,0.5);border-radius:12px;font-size:14px}
.msg{font-size:13px;text-align:center;min-height:16px;margin:4px 0 2px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;height:36px;font-size:13px;background:transparent;border:1px solid var(--line2);color:#b5b5b5;border-radius:8px;padding:0 2px}
.tab.on{background:var(--mint);color:#0B0B0B;border-color:var(--mint);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pmid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px}
.rbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 8px;line-height:1.2;text-align:center;background:var(--card);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-size:14px;font-weight:500;min-width:0}
.rbtn.cust{border-color:var(--mint);color:var(--mint)}
.rbtn svg{flex:none;color:var(--mint)}
.xbtn{height:36px;padding:0 10px;border-radius:8px;background:transparent;border:1px solid rgba(242,121,124,0.5);color:var(--red2);font-size:13px;flex:none;white-space:nowrap}
.arr{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--line2);color:#e8e8e8;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.arr:disabled{opacity:.3;cursor:default}
.arr.gone{visibility:hidden}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.stat .k{font-size:12px;color:var(--mut)}
.stat .n{font-size:20px;font-weight:600;margin-top:2px}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.met{background:var(--card);border-radius:10px;padding:8px 10px}
.met .k{font-size:12px;color:var(--mut)}
.met .n{font-size:16px;font-weight:600;margin-top:2px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(214,110,20,0.14);border:1px solid rgba(214,110,20,0.55);color:#FFB066;font-size:14px}
.pill svg{flex:none;color:var(--amber)}
.pill .pl{flex:1}
.pill .pv{font-weight:600;font-size:15px;text-align:right}
.pill.neutral{background:var(--card);border-color:var(--line2);color:var(--mut)}
.pill.neutral svg{color:var(--mut)}
.donut{position:relative;width:180px;height:180px;margin:4px auto 10px}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.brow .d{width:10px;height:10px;border-radius:50%;flex:none}
.brow .v{margin-left:auto;font-weight:500}
.brow.click{cursor:pointer}
.sublines{padding:0 0 6px 20px;font-size:13px;color:var(--mut)}
.sublines div{display:flex;justify-content:space-between;padding:2px 0}
.sec{font-size:14px;color:var(--mut);margin:14px 0 8px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;font-size:13px;background:transparent;border:1px solid var(--line2);color:#b5b5b5;border-radius:16px}
.chip.on{background:var(--mint);color:#0B0B0B;border-color:var(--mint);font-weight:600}
.trip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:inherit;font-size:inherit}
.trip.stopped{opacity:.55}
.trip .dt{font-size:13px;color:var(--mut);min-width:48px}
.trip .mid{flex:1;min-width:0}
.trip .l1{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip .l2{font-size:12px;color:var(--mut)}
.trip .pf{font-size:15px;font-weight:600;text-align:right}
.trip .pf small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.bdgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.bdg{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap;font-family:inherit}
.bdg.gold{background:rgba(245,197,66,0.14);border-color:rgba(245,197,66,0.5);color:var(--gold)}
.bdg.cyan{background:rgba(79,216,224,0.12);border-color:rgba(79,216,224,0.5);color:var(--cyan)}
.bdg.red{background:rgba(229,72,77,0.14);border-color:rgba(229,72,77,0.55);color:var(--red2)}
.bdg.big{height:30px;padding:0 12px;font-size:13px;border-radius:15px}
button.bdg{cursor:pointer}
button.bdg.open{box-shadow:0 0 0 2px rgba(255,255,255,0.15)}
.ach{margin:0 0 12px}
.ach .cap{font-size:12px;color:var(--mut);margin-bottom:8px}
.xpl{margin-top:10px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:8px 14px 12px}
.xpl .fm{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.4}
.xpl .wn{font-size:12px;color:var(--amber);margin-top:6px;line-height:1.4}
.sortrow{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.sortrow .chip{height:30px;font-size:12px;padding:0 10px}
.empty{text-align:center;color:var(--mut);padding:22px 8px;font-size:14px;line-height:1.5}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 8px;line-height:1.4}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:#3EE0A8;flex:none}
.hero{text-align:center;margin:4px 0 12px}
.hero .t{font-size:26px;font-weight:600}
.hero .s{font-size:14px;color:var(--mut);margin-top:2px}
.final{background:var(--mint-soft);border:1px solid rgba(62,224,168,0.4);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.bk{background:var(--card);border:1px solid rgba(62,224,168,0.35);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.bk h3{color:var(--mint);font-weight:600;font-size:14px;margin:0 0 6px}
.bk h3.hh{display:flex;align-items:center;gap:6px}
.bk .rec{margin-top:6px;padding:8px 12px;border-radius:10px;background:var(--mint-soft);display:flex;justify-content:space-between;align-items:baseline}
.bk .rec .big{font-size:21px;font-weight:600;color:var(--mint)}
.bk .ask{font-size:14px;margin-top:6px;color:var(--txt)}
.bk.ok{background:var(--mint-soft)}
.bk .okt{font-size:15px;font-weight:600;color:var(--mint)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,11,0.96);border-top:1px solid var(--line);display:flex;padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px;max-width:520px;margin:0 auto;z-index:5}
nav button{flex:1;background:transparent;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:4px 0}
nav button.on{color:var(--mint)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:94vh;overflow-y:auto;background:#121212;border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.chead .ct{flex:1;text-align:center;font-weight:600;font-size:15px}
.cwd,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cwd div{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.day{height:46px;border:none;background:transparent;color:var(--txt);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:14px}
.day .dd{width:6px;height:6px;border-radius:50%}
.day.inr{background:var(--mint-soft);border-radius:0}
.day.sel{background:var(--mint);color:#0B0B0B;font-weight:700;border-radius:8px}
.day.today:not(.sel){box-shadow:inset 0 0 0 1px rgba(255,255,255,0.35)}
.dd.good{background:#3EE0A8}.dd.mid{background:#F2C94C}.dd.bad{background:#E5484D}.dd.none{background:#3a3a3a}.dd.zero{background:transparent;box-shadow:inset 0 0 0 1.5px #aaa}
.day.sel .dd.none{background:#7a7a7a}
.day.sel .dd.good{background:#0B6B4B}
.cleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px;font-size:12px;color:var(--mut)}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.csel{font-size:13px;color:var(--mut);text-align:center;min-height:20px;margin-bottom:10px}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[hidden]{display:none !important}
</style>
</head>
<body>

<section id="scrCalc">
  <div class="hdr">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg></div>
    <h1 id="calcTitle"></h1>
    <button class="lbtn" type="button" aria-label="Language"><span>🌐</span><span><b class="lr">RU</b>/<b class="le">EN</b></span></button>
  </div>

  <div class="grid">
    <div class="f full"><label for="dt"><i class="ic" data-ic="calendar-days"></i><span data-i="tripDate"></span></label><input id="dt" type="date"></div>
    <div class="route">
      <div class="f"><label for="pu"><i class="ic" data-ic="map-pin"></i><span data-i="lblPickup"></span></label><select id="pu"><option value="" data-i="state"></option></select></div>
      <div class="f"><label for="de"><i class="ic" data-ic="flag"></i><span data-i="lblDelivery"></span></label><select id="de"><option value="" data-i="state"></option></select></div>
      <div class="f"><label><i class="ic" data-ic="list-ordered"></i><span data-i="lblStops"></span></label><div class="cnt"><button type="button" id="minus" data-al="lessStops" disabled>&minus;</button><span id="sv">0</span><button type="button" id="plus" data-al="moreStops">+</button></div></div>
    </div>
    <div class="f"><label for="lm"><i class="ic" data-ic="package-check"></i><span data-i="loadedMi"></span></label><input id="lm" type="number" inputmode="decimal" min="0" data-ph="phMiles"></div>
    <div class="f"><label for="dm"><i class="ic" data-ic="truck"></i><span data-i="deadMi"></span></label><input id="dm" type="number" inputmode="decimal" min="0" data-ph="phMiles"></div>
    <div class="f"><label for="lr"><i class="ic" data-ic="dollar-sign"></i><span data-i="loadRate"></span></label><input id="lr" type="number" inputmode="decimal" min="0" data-ph="phSum"></div>
    <div class="f"><label for="fp"><i class="ic" data-ic="fuel"></i><span data-i="diesel"></span></label><input id="fp" type="number" inputmode="decimal" min="0" step="0.01" data-ph="phPrice"></div>
    <div class="f"><label for="mg"><i class="ic" data-ic="gauge"></i><span data-i="mpgL"></span></label><input id="mg" type="number" inputmode="decimal" min="0" step="0.1" data-ph="phMpg"><div class="err" id="mgerr"></div></div>
    <div class="f"><label for="cp"><i class="ic" data-ic="percent"></i><span data-i="commPct"></span></label><input id="cp" type="number" inputmode="decimal" min="0" data-ph="phPct"></div>
    <div class="f full"><label for="ex"><i class="ic" data-ic="receipt"></i><span data-i="otherLbl"></span></label><input id="ex" type="number" inputmode="decimal" min="0" data-ph="phSum"></div>
  </div>

  <div class="card">
    <h3 class="hh"><i class="ic" data-ic="calculator"></i><span data-i="resTitle"></span></h3>
    <div class="rpm2">
      <div class="rtile"><div class="k"><i class="ic" data-ic="trending-up"></i>Gross RPM</div><div class="n" id="rgr">—</div></div>
      <div class="rtile"><div class="k"><i class="ic" data-ic="wallet"></i>Net RPM</div><div class="n" id="rnr">—</div></div>
    </div>
    <div class="rw"><span class="lb"><i class="ic" data-ic="dollar-sign"></i><span data-i="rLoad"></span></span><span id="rg">$0.00</span></div>
    <div class="rw"><span class="lb"><i class="ic" data-ic="fuel"></i><span data-i="rFuel"></span></span><span id="rf" style="color:var(--red2)">$0.00</span></div>
    <div class="rw"><span class="lb"><i class="ic" data-ic="percent"></i><span data-i="rComm"></span></span><span id="rc" style="color:var(--red2)">$0.00</span></div>
    <div class="rw"><span class="lb"><i class="ic" data-ic="receipt-text"></i><span data-i="rOther"></span></span><span id="re" style="color:var(--red2)">$0.00</span></div>
    <div class="rw tot"><span data-i="rTotal"></span><span id="rt" style="color:var(--red2)">$0.00</span></div>
    <div class="pbox" id="pbox"><span class="lbl"><i class="ic big" data-ic="circle-dollar-sign"></i><span data-i="rNet"></span></span><span class="big" id="rp">$0.00</span></div>
    <div class="note" style="margin-top:6px;font-size:12px" data-i="calcNote"></div>
  </div>

  <button class="btn-m" id="save"></button>
  <div class="msg" id="saved"></div>
  <button class="btn-g" id="clr" data-i="clear"></button>
  <button class="btn-g" id="cancelEdit" data-i="cancel" style="margin-top:6px" hidden></button>
</section>

<section id="scrTrips" hidden>
  <div class="hdr">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7a1 1 0 0 1 1-1h10v11"/><path d="M14 9h4l3 3v5h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>
    <h1 data-i="tripsTitle"></h1>
    <button class="lbtn" type="button" aria-label="Language"><span>🌐</span><span><b class="lr">RU</b>/<b class="le">EN</b></span></button>
  </div>
  <div class="tabs">
    <button class="tab" data-p="week" data-i="wk"></button>
    <button class="tab" data-p="month" data-i="mo"></button>
    <button class="tab" data-p="year" data-i="yr"></button>
    <button class="tab" data-p="all" data-i="all"></button>
  </div>
  <div class="pnav">
    <button class="arr" id="prev" data-al="prevP"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="pmid">
      <button class="rbtn" id="rbtn" type="button" data-al="pickDates"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="plabel"></span></button>
      <button class="xbtn" id="rreset" type="button" hidden>✕ <span data-i="resetBtn"></span></button>
    </div>
    <button class="arr" id="next" data-al="nextP"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>

function findTrip(id) {

  }

function addRec(map, tag, rec, cb) {
  var prefix = tag + '_' + rec.d.slice(0, 7).replace('-', '_') + '_';
  var key = null, maxIdx = -1;
  Object.keys(map).forEach(function (k) {
    if (k.indexOf(prefix) === 0) {
      var idx = parseInt(k.slice(prefix.length), 10);
      if (idx > maxIdx) maxIdx = idx;
      if (key === null && map[k].length < CHUNK_MAX) key = k;
    }
  });
  if (key === null) key = prefix + (maxIdx + 1);
  var arr = (map[key] || []).concat([rec]);
  store.set(key, JSON.stringify(arr), function (ok) {
    if (ok) map[key] = arr;
    cb(ok, key);
  });
}

function removeRec(map, key, id, cb) {
  var arr = (map[key] || []).filter(function (t) { return t.i !== id; });
  var done = function (ok) {
    if (ok) { if (arr.length) map[key] = arr; else delete map[key]; }
    cb(ok);
  };
  if (arr.length) store.set(key, JSON.stringify(arr), done); else store.remove(key, done);
}

function updateTrip(key, rec, cb) {
  var oldPrefix = key.replace(/\d+$/, '');
  var newPrefix = 'm_' + rec.d.slice(0, 7).replace('-', '_') + '_';
  if (oldPrefix === newPrefix) {
    var arr = chunks[key].map(function (t) { return t.i === rec.i ? rec : t; });
    store.set(key, JSON.stringify(arr), function (ok) {
      if (ok) chunks[key] = arr;
      cb(ok);
    });
    return;
  }
  addRec(chunks, 'm', rec, function (ok, newKey) {
    if (!ok) { cb(false); return; }
    removeRec(chunks, key, rec.i, function (ok2) {
      if (ok2) { cb(true); return; }
      removeRec(chunks, newKey, rec.i, function () { cb(false); });
    });
  });
}

  var out = [], d;
  if (def.f === 'o') {
    if (def.start >= from && def.start <= to) out.push({ d: def.start, a: def.ver[0].a });
    return out;
  }
  var hi = to;
  if (def.stop) { var lastOk = addDays(def.stop, -1); if (lastOk < hi) hi = lastOk; }
  var lo = from > def.start ? from : def.start;
  if (lo > hi) return out;
  if (def.f === 'w') {
    d = addDays(lo, (def.dow - dayOfWeek(lo) + 7) % 7);
    while (d <= hi) { out.push({ d: d, a: verAmount(def, d) }); d = addDays(d, 7); }
  } else {
    var y = +lo.slice(0, 4), m = +lo.slice(5, 7) - 1;
    for (;;) {
      var day = Math.min(def.dom, daysInMonth(y, m));
      d = y + '-' + pad(m + 1) + '-' + pad(day);
      if (d > hi) break;
      if (d >= lo) out.push({ d: d, a: verAmount(def, d) });
      m++;
      if (m > 11) { m = 0; y++; }
    }
  }
  return out;
}

/* ---------- периоды ---------- */

function periodRange(p, off) {
  var today = ymd(new Date());
  var from, to, label;
  if (p === 'custom' && cust) {
    from = cust.from; to = cust.to; label = rangeLabel(from, to);
  } else if (p === 'week') {
    var dow = (dayOfWeek(today) + 6) % 7;
    from = addDays(today, -dow + 7 * off);
    to = addDays(from, 6);
    label = rangeLabel(from, to);
  } else if (p === 'month') {
    var n = new Date(parseYmd(today).getFullYear(), parseYmd(today).getMonth() + off, 1);
    from = ymd(n);
    to = ymd(new Date(n.getFullYear(), n.getMonth() + 1, 0));
    label = L('monf')[n.getMonth()] + ' ' + n.getFullYear();
  } else if (p === 'year') {
    var y = parseYmd(today).getFullYear() + off;
    from = y + '-01-01';
    to = y + '-12-31';
    label = String(y);
  } else {
    from = '0000-00-00';
    to = '9999-12-31';
    label = L('allData');
  }
  return { from: from, to: to, label: label, today: today, kind: p };
}
function curRange() { return periodRange(period, offset); }

function computeStats(rg) {
  var items = listAll(chunks).filter(function (p) { return p.t.d >= rg.from && p.t.d <= rg.to; });
  var s = { items: items, gross: 0, loaded: 0, dead: 0, fuel: 0, comp: 0, other: 0, gen: [], genTotal: 0 };
  items.forEach(function (p) {
    var r = calcTrip(p.t);
    s.gross += r.gross; s.loaded += p.t.a; s.dead += p.t.b;
    s.fuel += r.fuel; s.comp += r.comp; s.other += r.other;
  });
  var cto = rg.to < rg.today ? rg.to : rg.today;
  Object.keys(defs).forEach(function (id) {
    var d = defs[id], ch = charges(d, rg.from, cto);
    if (!ch.length) return;
    var tot = 0;
    ch.forEach(function (c) { tot += c.a; });
    s.gen.push({ def: d, ch: ch, total: tot });
    s.genTotal += tot;
  });
  s.gen.sort(function (p, q) { return p.def.n < q.def.n ? -1 : p.def.n > q.def.n ? 1 : 0; });
  s.costs = s.fuel + s.comp + s.other + s.genTotal;
  s.net = s.gross - s.costs;
  s.miles = s.loaded + s.dead;
  return s;
}

function daysWithoutTrips(rg, items) {
  if (!items.length) return null;
  var from = rg.from;
  if (rg.kind === 'all') {
    from = items[items.length - 1].t.d;
    items.forEach(function (p) { if (p.t.d < from) from = p.t.d; });
  }
  var to = rg.to < rg.today ? rg.to : rg.today;
  if (from > to) return null;
  var total = daysBetween(from, to), seen = {}, cnt = 0;
  items.forEach(function (p) {
    if (p.t.d >= from && p.t.d <= to && !seen[p.t.d]) { seen[p.t.d] = 1; cnt++; }
  });
  return { without: total - cnt, total: total };
}

/* рейтинг: считается по рейсам выбранного периода, по точным значениям */
function computeRanks(items) {
  var out = {};
  var vals = items.map(function (p) {
    return { id: p.t.i, pr: calcTrip(p.t).profit, rpm: rpmOf(p.t) };
  });
  if (vals.length >= 2) {
    var mx = -Infinity, mn = Infinity;
    vals.forEach(function (v) { if (v.pr > mx) mx = v.pr; if (v.pr < mn) mn = v.pr; });
    if (mx - mn > EPS) vals.forEach(function (v) { if (v.pr >= mx - EPS) (out[v.id] = out[v.id] || {}).profit = true; });
  }
  var valid = vals.filter(function (v) { return v.rpm !== null; });
  if (valid.length >= 2) {
    var bx = -Infinity, bn = Infinity;
    valid.forEach(function (v) { if (v.rpm > bx) bx = v.rpm; if (v.rpm < bn) bn = v.rpm; });
    if (bx - bn > EPS) {
      valid.forEach(function (v) {
        if (v.rpm >= bx - EPS) (out[v.id] = out[v.id] || {}).best = true;
        if (v.rpm <= bn + EPS) (out[v.id] = out[v.id] || {}).worst = true;
      });
    }
  }
  return out;
}

function sortItems(items) {
  if (sortMode === 'n') return items;
  var arr = items.map(function (p, i) { return { p: p, i: i, v: rpmOf(p.t) }; });
  arr.sort(function (a, b) {
    if (a.v === null && b.v === null) return a.i - b.i;
    if (a.v === null) return 1;
    if (b.v === null) return -1;
    if (Math.abs(a.v - b.v) < EPS) return a.i - b.i;
    return sortMode === 'd' ? b.v - a.v : a.v - b.v;
  });
  return arr.map(function (x) { return x.p; });
}

function badgeInfo(kind) {
  if (kind === 'profit') return { cls: 'gold', icon: '🏆', text: L('bProfit') };
  if (kind === 'best') return { cls: 'cyan', icon: '📈', text: L('bRpm') };
  return { cls: 'red', icon: '📉', text: L('bWorst') };
}
function badgeKinds(rk) {
  var k = [];
  if (rk && rk.profit) k.push('profit');
  if (rk && rk.best) k.push('best');
  if (rk && rk.worst) k.push('worst');
  return k;
}

  if (calOpen) { closeCal(); return; }
  if (view === 'detail') { openTrips(true); }

function cancelEdit() {
  var id = editing ? editing.id : null;
  editing = null;
  resetCalcMode();
  resetForm();
  if (id !== null && findTrip(id)) openDetail(id, true); else openTrips(false);
}

function saveTrip() {
  var t = calcForm();
  var d = $('dt').value || ymd(new Date());
  if (t.r <= 0) { msg('msgNeedRate', false); return; }
  if (t.a + t.b <= 0) { msg('msgNeedMiles', false); return; }
  if (t.g <= 0) { msg('msgNeedMpg', false); return; }
  var rec = { i: editing ? editing.id : Date.now(), d: d, a: t.a, b: t.b, r: t.r, f: t.f, g: t.g, c: t.c, x: t.x, p: $('pu').value, v: $('de').value, s: stops };
  $('save').disabled = true;
  if (editing) {
    updateTrip(editing.k, rec, function (ok) {
      $('save').disabled = false;
      if (!ok) { msg('msgFail', false); return; }
      editing = null;
      resetCalcMode();
      resetForm();
      openDetail(rec.i, true);
    });
    return;
  }
  addRec(chunks, 'm', rec, function (ok) {
    $('save').disabled = false;
    if (!ok) { msg('msgFail', false); return; }
    saveSettings({ f: t.f, g: t.g, c: t.c });
    saveDone = true;
    setSaveBtn();
    msg('msgSaved', true);
  });

var CIRC = 2 * Math.PI * 70;
var CAL_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

function renderTrips() {
  var rg = curRange();
  var isCust = period === 'custom';
  qsa('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === period); });
  $('plabel').textContent = rg.label;
  $('rbtn').classList.toggle('cust', isCust);
  $('rreset').hidden = !isCust;
  var isAll = period === 'all';
  $('prev').classList.toggle('gone', isAll);
  $('next').classList.toggle('gone', isAll);
  if (isCust) {
    var n = daysBetween(cust.from, cust.to);
    $('next').disabled = addDays(cust.from, n) > rg.today;
  } else {
    $('next').disabled = offset >= 0;
  }
  qsa('#sortrow .chip').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-o') === sortMode); });

  var s = computeStats(rg);
  var col = s.net < 0 ? 'var(--red2)' : 'var(--mint)';
  $('cg').textContent = money(s.gross);
  $('cn').textContent = money(s.net);
  $('cn').style.color = col;
  $('cgr').textContent = s.miles > 0 ? money2(s.gross / s.miles) : '—';
  $('cnr').textContent = s.miles > 0 ? money2(s.net / s.miles) : '—';
  $('cnr').style.color = s.miles > 0 ? col : 'var(--mut)';
  $('ml').textContent = Math.round(s.loaded).toLocaleString('en-US');
  $('md').textContent = Math.round(s.dead).toLocaleString('en-US');
  $('mt').textContent = Math.round(s.miles).toLocaleString('en-US');
  $('cc').textContent = money(s.net);
  $('cc').style.color = col;
  $('trips').textContent = s.items.length + ' ' + tripWord(s.items.length);
  $('te').textContent = money(s.costs);
  $('tn').textContent = money(s.net);
  $('tn').style.color = col;

  var dw = daysWithoutTrips(rg, s.items);
  $('pill').hidden = !isCust;
  $('pill').classList.toggle('neutral', !dw);
  $('pillv').textContent = dw ? L('pillVal', dw.without, dw.total) : '—';

  var brk = $('brk');
  brk.innerHTML = '';
  var segs = [];
  if (s.net > 0) segs.push([s.net, '#3EE0A8']);
  function addRow(label, value, color, detail) {
    var r = el('div', 'brow' + (detail ? ' click' : ''));
    var dot = el('span', 'd');
    dot.style.background = color;
    r.appendChild(dot);
    r.appendChild(el('span', '', label));
    r.appendChild(el('span', 'v', money(value)));
    brk.appendChild(r);
    segs.push([value, color]);
    if (detail) {
      var sub = el('div', 'sublines');
      sub.hidden = true;
      detail.forEach(function (c) {
        var l = el('div');
        l.appendChild(el('span', '', fmtShort(c.d)));
        l.appendChild(el('span', '', money2(c.a)));
        sub.appendChild(l);
      });
      brk.appendChild(sub);
      r.onclick = function () { sub.hidden = !sub.hidden; };
    }
  }
  addRow(L('rFuel'), s.fuel, '#E5484D');
  addRow(L('rComm'), s.comp, '#F2797C');
  addRow(L('rOther'), s.other, '#F6A5A7');
  s.gen.forEach(function (g, i) { addRow(g.def.n, g.total, GEN_COLORS[i % GEN_COLORS.length], g.ch); });

  var ring = $('ring');
  ring.innerHTML = '';
  var base = Math.max(s.gross, s.costs), cum = 0;
  segs.forEach(function (sg) {
    var len = base > 0 ? sg[0] / base * CIRC : 0;
    if (len <= 0) return;
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', 90);
    c.setAttribute('cy', 90);
    c.setAttribute('r', 70);
    c.setAttribute('stroke', sg[1]);
    c.setAttribute('stroke-dasharray', len + ' ' + (CIRC - len));
    c.setAttribute('stroke-dashoffset', -cum);
    ring.appendChild(c);
    cum += len;
  });

  var list = $('list');
  list.innerHTML = '';
  if (!s.items.length) {
    list.appendChild(el('div', 'empty', L('emptyTrips')));
    return;
  }
  var ranks = computeRanks(s.items);
  sortItems(s.items).forEach(function (p) {
    var r = calcTrip(p.t);

    row.appendChild(el('div', 'dt', fmtShort(p.t.d)));

    if (kinds.length) {
      var bd = el('div', 'bdgs');
      kinds.forEach(function (k) {
        var bi = badgeInfo(k);
        var sp = el('span', 'bdg ' + bi.cls, bi.icon + ' ' + bi.text);
        sp.setAttribute('data-k', k);
        bd.appendChild(sp);
      });
      mid.appendChild(bd);
    }
    mid.appendChild(el('div', 'l1', routeText(p.t)));
    mid.appendChild(el('div', 'l2', Math.round(r.miles) + ' ' + L('miWord') + ' · Gross ' + money(r.gross)));
    row.appendChild(mid);
    var pf = el('div', 'pf', money(r.profit));
    pf.style.color = r.profit < 0 ? 'var(--red2)' : 'var(--mint)';
    pf.appendChild(el('small', '', L('left')));
    row.appendChild(pf);
    row.onclick = function () { openDetail(p.t.i, true); };
    list.appendChild(row);
  });
}

function openCal() {

function dayAgg() {
  var m = {};
  listAll(chunks).forEach(function (p) {
    var r = calcTrip(p.t), a = m[p.t.d] || (m[p.t.d] = { profit: 0, miles: 0, gross: 0 });
    a.gross += r.gross;
    a.profit += r.profit;
    a.miles += r.miles;
  });
  return m;
}
function dayColor(a) {
  if (!a) return 'none';
  if (Math.abs(a.profit) < 0.005) return 'zero';
  if (a.profit < 0) return 'bad';
  var g = goal();
  if (!g) return 'good';
  return a.miles > 0 && (goalMode() === 'g' ? a.gross : a.profit) / a.miles >= g - EPS ? 'good' : 'mid';
}

function renderCal() {
  $('cTitle').textContent = L('monf')[calM] + ' ' + calY;
  var wd = $('cWd');
  wd.innerHTML = '';
  L('wd').forEach(function (d) { wd.appendChild(el('div', '', d)); });
  var grid = $('cGrid');
  grid.innerHTML = '';
  var agg = dayAgg(), today = ymd(new Date());
  var lead = (new Date(calY, calM, 1).getDay() + 6) % 7;
  for (var i = 0; i < lead; i++) grid.appendChild(el('div'));
  var hi = selB || selA;
  for (var d = 1; d <= daysInMonth(calY, calM); d++) {
    var ds = calY + '-' + pad(calM + 1) + '-' + pad(d);
    var b = el('button', 'day');
    b.type = 'button';
    b.setAttribute('data-d', ds);
    b.appendChild(el('span', '', String(d)));
    b.appendChild(el('span', 'dd ' + dayColor(agg[ds])));
    if (selA && ds >= selA && ds <= hi) b.classList.add('inr');
    if (ds === selA || ds === hi) b.classList.add('sel');
    if (ds === today) b.classList.add('today');
    b.onclick = (function (x) { return function () { pickDay(x); }; })(ds);
    grid.appendChild(b);
  }
  var leg = $('cLeg');
  leg.innerHTML = '';
  [['good', goal() ? 'lgGood' : 'lgGoodNoGoal'], ['mid', 'lgMid'], ['bad', 'lgBad'], ['none', 'lgNone']].forEach(function (x) {
    if (x[0] === 'mid' && !goal()) return;
    var sp = el('span');
    var dot = el('i');
    dot.className = 'dd ' + x[0];
    dot.style.width = '8px'; dot.style.height = '8px';
    sp.appendChild(dot);
    sp.appendChild(document.createTextNode(L(x[1])));
    leg.appendChild(sp);
  });
  $('cSel').textContent = selA ? L('calSel', rangeLabel(selA, selB || selA)) : L('calHint');
  $('cApply').disabled = !selA;
}

function pickDay(ds) {
  if (!selA || selB) { selA = ds; selB = null; }
  else if (ds < selA) { selB = selA; selA = ds; }
  else { selB = ds; }
  if (selB === selA) selB = null;
  renderCal();
}

function applyCal() {
  if (!selA) return;
  if (period !== 'custom') lastStd = { p: period, off: offset };
  cust = { from: selA, to: selB || selA };
  period = 'custom';
  closeCal();
  renderTrips();
}

function resetCustom() {
  period = lastStd.p;
  offset = lastStd.off;
  renderTrips();
}

function shiftPeriod(dir) {
  if (period === 'custom') {
    var n = daysBetween(cust.from, cust.to);
    if (dir > 0 && addDays(cust.from, n) > ymd(new Date())) return;
    cust = { from: addDays(cust.from, dir * n), to: addDays(cust.to, dir * n) };
  } else if (dir < 0) {
    offset -= 1;
  } else if (offset < 0) {
    offset += 1;
  }
  renderTrips();
}

/* ---------- общие расходы ---------- */

function curAmount(d) { return d.ver[d.ver.length - 1].a; }

function freqName(f) { return f === 'w' ? L('perWeek') : f === 'm' ? L('perMonth') : L('perOnce'); }

function openExp() {
  show('exp');
  renderExpList();
}

function renderExpList() {
  qsa('.chip[data-f]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-f') === expFilter); });
  var order = { w: 0, m: 1, o: 2 };
  var items = Object.keys(defs).map(function (id) { return defs[id]; }).filter(function (d) {
    return expFilter === 'all' || d.f === expFilter;
  });
  items.sort(function (p, q) {
    if (order[p.f] !== order[q.f]) return order[p.f] - order[q.f];
    if (p.f === 'o') return p.start < q.start ? 1 : -1;
    return p.n < q.n ? -1 : p.n > q.n ? 1 : 0;
  });
  var list = $('xlist');
  list.innerHTML = '';
  if (!items.length) {
    list.appendChild(el('div', 'empty', L('emptyExp')));
    return;
  }
  items.forEach(function (d) {
    var row = el('button', 'trip' + (d.stop ? ' stopped' : ''));
    row.type = 'button';
    var mid = el('div', 'mid');
    mid.appendChild(el('div', 'l1', d.n));
    var sub;
    if (d.f === 'w') sub = L('evDow' + d.dow) + ' · ' + L('since', fmtShort(d.start));
    else if (d.f === 'm') sub = L('evDom', d.dom) + ' · ' + L('since', fmtShort(d.start));
    else sub = fmtLong(d.start);
    if (d.stop) sub += ' · ' + L('stoppedFrom', fmtShort(d.stop));
    mid.appendChild(el('div', 'l2', sub));
    row.appendChild(mid);
    var pf = el('div', 'pf', money2(curAmount(d)) + ' / ' + freqName(d.f));
    pf.style.color = 'var(--red2)';
    pf.style.fontSize = '14px';
    row.appendChild(pf);
    row.onclick = function () { openExpForm(d.id); };
    list.appendChild(row);
  });
}

function fillSelect(sel, options) {
  var keep = sel.value;
  sel.innerHTML = '';
  options.forEach(function (o) {
    var opt = document.createElement('option');
    opt.value = o[0];
    opt.textContent = o[1];
    sel.appendChild(opt);
  });
  if (keep) sel.value = keep;
}

function fillFormSelects() {
  fillSelect($('xdw'), WD_ORDER.map(function (n) { return [String(n), L('dow' + n)]; }));
  if (expEditing && expEditing.f === 'o') fillSelect($('xf'), [['o', L('freqO')]]);
  else if (expEditing) fillSelect($('xf'), [['w', L('freqW')], ['m', L('freqM')]]);
  else fillSelect($('xf'), [['w', L('freqW')], ['m', L('freqM')], ['o', L('freqO')]]);
}

function updateFormMode() {
  var f = $('xf').value;
  var edit = !!expEditing;
  var regEdit = edit && expEditing.f !== 'o';
  $('xslabel').textContent = f === 'o' ? L('xDate') : L('xStart');
  $('xtitle').textContent = edit ? L('xEdit') : L('xAdd');
  $('xdwbox').hidden = f !== 'w';
  $('xdmbox').hidden = f !== 'm';
  $('xfromb').hidden = !regEdit;
  $('xfixb').hidden = !regEdit;
  $('xhint').hidden = f === 'o';
  $('xs').disabled = regEdit && !$('xfix').checked;
  $('xstop').hidden = !(regEdit && !expEditing.stop);
  $('xdel').hidden = !edit;
  $('xf').disabled = edit && expEditing.f === 'o';
}

function openExpForm(id) {
  expEditing = id ? defs[id] : null;
  formError(null);
  var today = ymd(new Date());
  $('xdw').innerHTML = '';
  $('xf').innerHTML = '';
  fillFormSelects();
  if (!expEditing) {
    $('xn').value = '';
    $('xa').value = '';
    $('xf').value = 'w';
    $('xs').value = today;
    $('xdw').value = String(dayOfWeek(today));
    $('xdm').value = String(parseYmd(today).getDate());
    $('xfrom').value = today;
    $('xfix').checked = false;
  } else {
    var d = expEditing;
    $('xn').value = d.n;
    $('xa').value = curAmount(d);
    $('xf').value = d.f;
    $('xs').value = d.start;
    $('xdw').value = String(d.dow !== undefined ? d.dow : dayOfWeek(d.start));
    $('xdm').value = String(d.dom !== undefined ? d.dom : parseYmd(d.start).getDate());
    $('xfrom').value = today;
    $('xfix').checked = false;
  }
  updateFormMode();
  show('expForm');
}

function newId() { return 'k' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }

function saveDef(def, cb) {
  store.set('g_' + def.id, JSON.stringify(def), function (ok) {
    if (ok) defs[def.id] = def;
    cb(ok);
  });
}

function formError(key) {
  lastXerr = key || null;
  $('xerr').textContent = key ? L(key) : '';
}

function saveExpense() {
  var n = $('xn').value.trim(), a = num('xa'), f = $('xf').value, start = $('xs').value;
  var dow = parseInt($('xdw').value, 10), dom = parseInt($('xdm').value, 10);
  if (!n) { formError('eName'); return; }
  if (a <= 0) { formError('eAmt'); return; }
  if (!start) { formError('eDate'); return; }
  if (f === 'm' && !(dom >= 1 && dom <= 31)) { formError('eDom'); return; }
  formError(null);
  var done = function (ok) {
    if (!ok) { formError('msgFail'); return; }
    openExp();
  };

  if (!expEditing) {
    var def = { id: newId(), n: n, f: f, start: start, ver: [{ from: start, a: a }] };
    if (f === 'w') def.dow = dow;
    if (f === 'm') def.dom = dom;
    saveDef(def, done);
    return;
  }

  var old = expEditing;
  if (old.f === 'o') {
    var one = { id: old.id, n: n, f: 'o', start: start, ver: [{ from: start, a: a }] };
    saveDef(one, done);
    return;
  }

  var fix = $('xfix').checked;
  var from = $('xfrom').value || ymd(new Date());
  var scheduleChanged = f !== old.f || (f === 'w' && dow !== old.dow) || (f === 'm' && dom !== old.dom);
  if (fix || from <= old.start) {
    var rep = { id: old.id, n: n, f: f, start: fix ? start : old.start, ver: [], stop: old.stop };
    rep.ver = [{ from: rep.start, a: a }];
    if (f === 'w') rep.dow = dow;
    if (f === 'm') rep.dom = dom;
    if (!rep.stop) delete rep.stop;
    saveDef(rep, done);
    return;
  }
  if (scheduleChanged) {
    var closed = JSON.parse(JSON.stringify(old));
    closed.stop = from;
    var next = { id: newId(), n: n, f: f, start: from, ver: [{ from: from, a: a }] };
    if (f === 'w') next.dow = dow;
    if (f === 'm') next.dom = dom;
    saveDef(closed, function (ok) {
      if (!ok) { done(false); return; }
      saveDef(next, done);
    });
    return;
  }
  var upd = JSON.parse(JSON.stringify(old));
  upd.n = n;
  if (a !== curAmount(old)) {
    upd.ver = upd.ver.filter(function (v) { return v.from < from; });
    upd.ver.push({ from: from, a: a });
  }
  saveDef(upd, done);
}

function stopExpense() {
  var from = $('xfrom').value || ymd(new Date());
  if (from <= expEditing.start) { formError('eStop'); return; }
  askConfirm(L('cStop', fmtLong(from)), function () {
    var upd = JSON.parse(JSON.stringify(expEditing));
    upd.stop = from;
    saveDef(upd, function (ok) {
      if (!ok) { formError('msgFail'); return; }
      openExp();
    });
  });
}

function deleteExpense() {
  var d = expEditing;
  askConfirm(d.f === 'o' ? L('cDelOne') : L('cDelReg'), function () {
    store.remove('g_' + d.id, function (ok) {
      if (!ok) { formError('eDelFail'); return; }
      delete defs[d.id];
      openExp();
    });
  });
}

/* ---------- язык ---------- */

function applyLang() {
  document.documentElement.lang = lang;
  qsa('[data-i]').forEach(function (e) { e.textContent = L(e.getAttribute('data-i')); });
  qsa('[data-al]').forEach(function (e) { e.setAttribute('aria-label', L(e.getAttribute('data-al'))); });
  qsa('[data-ph]').forEach(function (e) { e.placeholder = L(e.getAttribute('data-ph')); });
  var dl = $('xnames');
  dl.innerHTML = '';
  L('names').forEach(function (n) { var o = document.createElement('option'); o.value = n; dl.appendChild(o); });
  qsa('.lbtn').forEach(function (b) {
    b.querySelector('.lr').classList.toggle('on', lang === 'ru');
    b.querySelector('.le').classList.toggle('on', lang === 'en');
  });
  $('calcTitle').textContent = editing ? L('editTitle') : L('calcTitle');
  setSaveBtn();
  if (lastMsg) msg(lastMsg.k, lastMsg.ok);
  calcForm();
  if (view === 'trips') renderTrips();
  if (view === 'detail' && detailId !== null) { var ref = findTrip(detailId); if (ref) renderDetail(ref); }
  if (view === 'exp') renderExpList();
  if (view === 'expForm') {
    fillFormSelects();
    updateFormMode();
    if (lastXerr) formError(lastXerr);
  }
  if (calOpen) renderCal();
}

function toggleLang() {
  lang = lang === 'ru' ? 'en' : 'ru';
  saveSettings({ l: lang });
  applyLang();
}

/* ---------- запуск ---------- */

STATES.forEach(function (s) {
  ['pu', 'de'].forEach(function (id) {
    var o = document.createElement('option');
    o.value = s;
    o.textContent = s;
    $(id).appendChild(o);
  });
});
['pu', 'de'].forEach(function (id) { $(id).addEventListener('change', markDirty); });
$('minus').onclick = function () { setStops(stops - 1); markDirty(); };
$('plus').onclick = function () { setStops(stops + 1); markDirty(); };
['dt', 'lm', 'dm', 'lr', 'fp', 'mg', 'cp', 'ex'].forEach(function (id) {
  $(id).addEventListener('input', function () { calcForm(); markDirty(); });
});
$('save').onclick = saveTrip;
$('clr').onclick = function () {
  ['lm', 'dm', 'lr', 'ex'].forEach(function (id) { $(id).value = ''; });
  $('pu').value = '';
  $('de').value = '';
  setStops(0);
  $('dt').value = ymd(new Date());
  calcForm();
  markDirty();
};
$('cancelEdit').onclick = cancelEdit;
$('nCalc').onclick = function () {
  if (editing) { editing = null; resetCalcMode(); resetForm(); }
  show('calc');
};
$('nTrips').onclick = function () {
  if (editing) { editing = null; resetCalcMode(); resetForm(); }
  openTrips(false);
};
qsa('.lbtn').forEach(function (b) { b.onclick = toggleLang; });
qsa('.tab').forEach(function (b) {
  b.onclick = function () { period = b.getAttribute('data-p'); offset = 0; renderTrips(); };
});
qsa('#sortrow .chip').forEach(function (b) {
  b.onclick = function () { sortMode = b.getAttribute('data-o'); saveSettings({ o: sortMode }); renderTrips(); };
});
$('prev').onclick = function () { shiftPeriod(-1); };
$('next').onclick = function () { shiftPeriod(1); };
$('rbtn').onclick = openCal;
$('rreset').onclick = resetCustom;
$('cClose').onclick = closeCal;
$('cal').addEventListener('click', function (e) { if (e.target === $('cal')) closeCal(); });
$('cPrev').onclick = function () { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$('cNext').onclick = function () { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };
$('cApply').onclick = applyCal;
$('cReset').onclick = function () {
  selA = null; selB = null;
  if (period === 'custom') { closeCal(); resetCustom(); } else renderCal();
};
$('openExp').onclick = openExp;
$('bkDetail').onclick = goBack;
$('bkExp').onclick = goBack;
$('bkForm').onclick = goBack;
qsa('.chip[data-f]').forEach(function (b) {
  b.onclick = function () { expFilter = b.getAttribute('data-f'); renderExpList(); };
});
$('xadd').onclick = function () { openExpForm(null); };
$('xf').addEventListener('change', updateFormMode);
$('xfix').addEventListener('change', updateFormMode);
$('xs').addEventListener('change', function () {
  if (!expEditing && $('xs').value) {
    $('xdw').value = String(dayOfWeek($('xs').value));
    $('xdm').value = String(parseYmd($('xs').value).getDate());
  }
});
['xn', 'xa', 'xs', 'xdm', 'xfrom'].forEach(function (id) { $(id).addEventListener('input', function () { formError(null); }); });
$('xsave').onclick = saveExpense;
$('xstop').onclick = stopExpense;
$('xdel').onclick = deleteExpense;
if (tg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch (e) {} }

var navTimer = null;
var touchUi = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
document.addEventListener('focusin', function (e) {
  if (touchUi && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { clearTimeout(navTimer); document.querySelector('nav').style.display = 'none'; }
});
document.addEventListener('pointerdown', function (e) {
  var a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && !/^(INPUT|SELECT|TEXTAREA|LABEL)$/.test(e.target.tagName)) a.blur();
});
document.addEventListener('focusout', function () {
  clearTimeout(navTimer);
  navTimer = setTimeout(function () { document.querySelector('nav').style.display = ''; }, 150);
});

function fillDefaults() {
  var today = ymd(new Date());
  $('dt').value = today;
  $('dt').max = today;
  if (settings.f) $('fp').value = settings.f;
  if (settings.g) $('mg').value = settings.g;
  if (settings.c !== undefined && settings.c !== null) $('cp').value = settings.c;
}

store.getAll(function (all) {
  Object.keys(all).forEach(function (k) {
    try {
      if (k.indexOf('m_') === 0) chunks[k] = JSON.parse(all[k]) || [];
      else if (k.indexOf('g_') === 0) { var d = JSON.parse(all[k]); if (d && d.id) defs[d.id] = d; }
      else if (k === 's') settings = JSON.parse(all[k]) || {};
    } catch (e) {}
  });
  if (settings.l === 'ru' || settings.l === 'en') lang = settings.l;
  if (settings.o === 'n' || settings.o === 'd' || settings.o === 'a') sortMode = settings.o;
  fillDefaults();
  applyLang();
});
applyIcons();
fillDefaults();
applyLang();
</script>
