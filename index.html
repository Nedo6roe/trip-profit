<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trip Profit</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--mint:#3EE0A8;--mint-soft:rgba(62,224,168,0.12);--bg:#0B0B0B;--card:#151515;--line:#262626;--line2:#2c2c2c;--txt:#F2F2F2;--mut:#9a9a9a;--red:#E5484D;--red2:#F2797C;--red3:#F6A5A7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding:16px 16px 96px;max-width:520px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0 0 16px}
button{font-family:inherit;cursor:pointer}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--mint);color:#0B0B0B;display:flex;align-items:center;justify-content:center;flex:none}
.hdr h1{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.f label{display:block;font-size:12px;color:var(--mut);margin:0 0 5px}
.f input,.f select{width:100%;height:44px;background:var(--card);border:1px solid var(--line2);color:#fff;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;color-scheme:dark}
.f select{padding:0 6px}
.f input:focus,.f select:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 2px rgba(62,224,168,0.25)}
.route{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.cnt{display:flex;align-items:center;height:44px;background:var(--card);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.cnt button{width:44px;height:100%;background:transparent;border:none;color:var(--mint);font-size:22px;line-height:1;padding:0}
.cnt button:active{background:#1f1f1f}
.cnt button:disabled{color:#444;cursor:default}
.cnt span{flex:1;text-align:center;font-size:16px;font-weight:600}
.f.full{grid-column:1 / -1}
.err{font-size:12px;color:var(--red2);margin-top:4px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.rw{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.rw span:last-child{font-weight:500}
.rw.tot{border-top:1px solid var(--line2);margin-top:4px;padding-top:10px}
.pbox{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--mint-soft);display:flex;justify-content:space-between;align-items:baseline}
.pbox .lbl{font-size:14px}
.pbox .big{font-size:24px;font-weight:600;color:var(--mint)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.btn-m{width:100%;height:48px;background:var(--mint);color:#0B0B0B;border:none;border-radius:12px;font-size:16px;font-weight:600}
.btn-m:active{opacity:.85}
.btn-m.done{background:#1c3a30;color:var(--mint)}
.btn-g{width:100%;height:42px;background:transparent;color:#b5b5b5;border:1px solid var(--line2);border-radius:12px;font-size:14px}
.msg{font-size:13px;text-align:center;min-height:20px;margin:8px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tab{flex:1;height:36px;font-size:13px;background:transparent;border:1px solid var(--line2);color:#b5b5b5;border-radius:8px;padding:0 2px}
.tab.on{background:var(--mint);color:#0B0B0B;border-color:var(--mint);font-weight:600}
.sub{font-size:13px;color:var(--mut);text-align:center;margin:0 0 12px;min-height:18px}
.donut{position:relative;width:200px;height:200px;margin:0 auto 12px}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.lg .d{width:12px;height:12px;border-radius:50%;flex:none}
.lg .v{margin-left:auto;font-weight:500}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.met{background:var(--card);border-radius:10px;padding:10px 12px}
.met .k{font-size:12px;color:var(--mut)}
.met .n{font-size:16px;font-weight:600;margin-top:2px}
.sec{font-size:14px;color:var(--mut);margin:4px 0 8px}
.trip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.trip .dt{font-size:13px;color:var(--mut);min-width:54px}
.trip .mid{flex:1;min-width:0}
.trip .l1{font-size:14px}
.trip .l2{font-size:12px;color:var(--mut)}
.trip .pf{font-size:15px;font-weight:600;text-align:right}
.trip .del{background:transparent;border:none;color:var(--mut);padding:6px;display:flex}
.empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px;line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,11,0.96);border-top:1px solid var(--line);display:flex;padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px;max-width:520px;margin:0 auto}
nav button{flex:1;background:transparent;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:4px 0}
nav button.on{color:var(--mint)}
[hidden]{display:none !important}
</style>
</head>
<body>

<section id="scrCalc">
  <div class="hdr">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg></div>
    <h1>Калькулятор рейса</h1>
  </div>

  <div class="grid">
    <div class="f full"><label for="dt">Дата рейса</label><input id="dt" type="date"></div>
    <div class="route">
      <div class="f"><label for="pu">Pickup</label><select id="pu"><option value="">Штат</option></select></div>
      <div class="f"><label for="de">Delivery</label><select id="de"><option value="">Штат</option></select></div>
      <div class="f"><label>Stops</label><div class="cnt"><button type="button" id="minus" aria-label="Меньше Stops" disabled>&minus;</button><span id="sv">0</span><button type="button" id="plus" aria-label="Больше Stops">+</button></div></div>
    </div>
    <div class="f"><label for="lm">Loaded Miles (с грузом)</label><input id="lm" type="number" inputmode="decimal" min="0" placeholder="800"></div>
    <div class="f"><label for="dm">Deadhead Miles (пустым)</label><input id="dm" type="number" inputmode="decimal" min="0" placeholder="100"></div>
    <div class="f"><label for="lr">Load rate, $</label><input id="lr" type="number" inputmode="decimal" min="0" placeholder="2400"></div>
    <div class="f"><label for="fp">Дизель, $ за галлон</label><input id="fp" type="number" inputmode="decimal" min="0" step="0.01" placeholder="3.80"></div>
    <div class="f"><label for="mg">MPG трака</label><input id="mg" type="number" inputmode="decimal" min="0" step="0.1" placeholder="6.5"><div class="err" id="mgerr"></div></div>
    <div class="f"><label for="cp">Процент компании, %</label><input id="cp" type="number" inputmode="decimal" min="0" placeholder="12"></div>
    <div class="f full"><label for="ex">Расходы, $ (другие траты за рейс)</label><input id="ex" type="number" inputmode="decimal" min="0" placeholder="150"></div>
  </div>

  <div class="card">
    <div class="rw"><span>Топливо</span><span id="rf">$0.00</span></div>
    <div class="rw"><span>Комиссия компании</span><span id="rc">$0.00</span></div>
    <div class="rw"><span>Расходы</span><span id="re">$0.00</span></div>
    <div class="rw tot"><span>Всего расходов</span><span id="rt" style="color:var(--red2)">$0.00</span></div>
    <div class="pbox" id="pbox"><span class="lbl">Вам остаётся</span><span class="big" id="rp">$0.00</span></div>
    <div class="note" id="rm"></div>
  </div>

  <button class="btn-m" id="save">Сохранить рейс</button>
  <div class="msg" id="saved"></div>
  <button class="btn-g" id="clr">Очистить поля</button>
</section>

<section id="scrTrips" hidden>
  <div class="hdr">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7a1 1 0 0 1 1-1h10v11"/><path d="M14 9h4l3 3v5h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></div>
    <h1>Мои рейсы</h1>
  </div>
  <div class="tabs">
    <button class="tab" data-p="week">Неделя</button>
    <button class="tab" data-p="month">Месяц</button>
    <button class="tab" data-p="year">Год</button>
    <button class="tab" data-p="all">Всё время</button>
  </div>
  <p class="sub" id="psub"></p>

  <div class="card" style="padding:16px">
    <div class="donut">
      <svg viewBox="0 0 180 180" width="200" height="200" role="img" aria-label="Круговой график доходов и расходов">
        <circle cx="90" cy="90" r="70" fill="none" stroke="#1f1f1f" stroke-width="22"/>
        <g transform="rotate(-90 90 90)" fill="none" stroke-width="22">
          <circle id="s0" cx="90" cy="90" r="70" stroke="#3EE0A8"/>
          <circle id="s1" cx="90" cy="90" r="70" stroke="#E5484D"/>
          <circle id="s2" cx="90" cy="90" r="70" stroke="#F2797C"/>
          <circle id="s3" cx="90" cy="90" r="70" stroke="#F6A5A7"/>
        </g>
      </svg>
      <div class="c">
        <div style="font-size:12px;color:var(--mut)">Gross</div>
        <div style="font-size:22px;font-weight:600" id="gross">$0</div>
        <div style="font-size:12px;color:var(--mut)" id="trips"></div>
      </div>
    </div>
    <div style="border-top:1px solid var(--line2);padding-top:6px">
      <div class="lg"><span class="d" style="background:#3EE0A8"></span>Осталось вам<span class="v" style="color:var(--mint)" id="l0"></span></div>
      <div class="lg"><span class="d" style="background:#E5484D"></span>Топливо<span class="v" id="l1"></span></div>
      <div class="lg"><span class="d" style="background:#F2797C"></span>Комиссия компании<span class="v" id="l2"></span></div>
      <div class="lg"><span class="d" style="background:#F6A5A7"></span>Другие расходы<span class="v" id="l3"></span></div>
    </div>
  </div>

  <div class="mets">
    <div class="met"><div class="k">Расходы</div><div class="n" style="color:var(--red2)" id="mx"></div></div>
    <div class="met"><div class="k">Осталось</div><div class="n" style="color:var(--mint)" id="mp"></div></div>
    <div class="met"><div class="k">Миль</div><div class="n" id="mm"></div></div>
  </div>

  <div class="sec">Рейсы за период</div>
  <div id="list"></div>
</section>

<nav>
  <button id="nCalc" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>Калькулятор</button>
  <button id="nTrips"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Мои рейсы</button>
</nav>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0B0B0B'); tg.setBackgroundColor('#0B0B0B'); } } catch (e) {}

var hasCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
var LS = 'tp_';
var store = {
  getAll: function (cb) {
    if (hasCloud) {
      tg.CloudStorage.getKeys(function (err, keys) {
        if (err || !keys || !keys.length) { cb({}); return; }
        tg.CloudStorage.getItems(keys, function (err2, vals) { cb(err2 ? {} : (vals || {})); });
      });
    } else {
      var out = {};
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf(LS) === 0) out[k.slice(LS.length)] = localStorage.getItem(k);
        }
      } catch (e) {}
      cb(out);
    }
  },
  set: function (k, v, cb) {
    if (hasCloud) { tg.CloudStorage.setItem(k, v, function (err, ok) { cb(!err && ok !== false); }); }
    else { try { localStorage.setItem(LS + k, v); cb(true); } catch (e) { cb(false); } }
  },
  remove: function (k, cb) {
    if (hasCloud) { tg.CloudStorage.removeItem(k, function (err, ok) { cb(!err && ok !== false); }); }
    else { try { localStorage.removeItem(LS + k); cb(true); } catch (e) { cb(false); } }
  }
};

var chunks = {};
var settings = {};
var CHUNK_MAX = 15;
var period = 'month';

function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function money(x) { return '$' + Math.round(x).toLocaleString('en-US'); }
function money2(x) { return (x < 0 ? '-$' : '$') + Math.abs(x).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function num(id) { var x = parseFloat($(id).value); return isFinite(x) && x > 0 ? x : 0; }
function plural(n) {
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return 'рейс';
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'рейса';
  return 'рейсов';
}
var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
var MONF = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

var STATES = ['AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA', 'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD', 'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ', 'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC', 'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'];
var STOPS_MAX = 20;
var stops = 0;

function stopsText(n) { return n + (n === 1 ? ' Stop' : ' Stops'); }

function routeText(t) {
  if (t.s === undefined && !t.p && !t.v) return 'Маршрут не указан';
  var n = t.s || 0;
  if (!t.p && !t.v) return 'Не указано | ' + stopsText(n);
  return (t.p || '—') + ' → ' + (t.v || '—') + ' | ' + stopsText(n);
}

function setStops(n) {
  stops = Math.max(0, Math.min(STOPS_MAX, n));
  $('sv').textContent = stops;
  $('minus').disabled = stops <= 0;
  $('plus').disabled = stops >= STOPS_MAX;
}

function calcTrip(t) {
  var miles = t.a + t.b;
  var fuel = t.g > 0 ? miles / t.g * t.f : 0;
  var comp = t.r * t.c / 100;
  var costs = fuel + comp + t.x;
  return { miles: miles, fuel: fuel, comp: comp, other: t.x, costs: costs, gross: t.r, profit: t.r - costs };
}

function calcForm() {
  var t = { a: num('lm'), b: num('dm'), r: num('lr'), f: num('fp'), g: num('mg'), c: num('cp'), x: num('ex') };
  var r = calcTrip(t);
  $('mgerr').textContent = (t.g > 0 || r.miles === 0) ? '' : 'Введите MPG больше нуля';
  $('rf').textContent = money2(r.fuel);
  $('rc').textContent = money2(r.comp);
  $('re').textContent = money2(r.other);
  $('rt').textContent = money2(r.costs);
  $('rp').textContent = money2(r.profit);
  var neg = r.profit < 0;
  $('rp').style.color = neg ? 'var(--red2)' : 'var(--mint)';
  $('pbox').style.background = neg ? 'rgba(242,121,124,0.12)' : 'var(--mint-soft)';
  $('rm').textContent = r.miles > 0 ? ('Всего ' + Math.round(r.miles) + ' миль, около ' + money2(r.profit / r.miles) + ' за милю') : '';
  return t;
}

function markDirty() {
  var b = $('save');
  b.textContent = 'Сохранить рейс';
  b.classList.remove('done');
  $('saved').textContent = '';
}

function msg(text, ok) {
  var m = $('saved');
  m.textContent = text;
  m.style.color = ok ? 'var(--mint)' : 'var(--red2)';
}

function allTrips() {
  var out = [];
  Object.keys(chunks).forEach(function (k) {
    chunks[k].forEach(function (t) { out.push({ t: t, k: k }); });
  });
  out.sort(function (p, q) { return p.t.d < q.t.d ? 1 : p.t.d > q.t.d ? -1 : q.t.i - p.t.i; });
  return out;
}

function saveTrip() {
  var t = calcForm();
  var d = $('dt').value || ymd(new Date());
  if (t.r <= 0) { msg('Введите Load rate, чтобы сохранить рейс', false); return; }
  if (t.a + t.b <= 0) { msg('Введите мили, чтобы сохранить рейс', false); return; }
  if (t.g <= 0) { msg('Введите MPG больше нуля', false); return; }
  var rec = { i: Date.now(), d: d, a: t.a, b: t.b, r: t.r, f: t.f, g: t.g, c: t.c, x: t.x, p: $('pu').value, v: $('de').value, s: stops };
  var prefix = 'm_' + d.slice(0, 7).replace('-', '_') + '_';
  var key = null, maxIdx = -1;
  Object.keys(chunks).forEach(function (k) {
    if (k.indexOf(prefix) === 0) {
      var idx = parseInt(k.slice(prefix.length), 10);
      if (idx > maxIdx) maxIdx = idx;
      if (key === null && chunks[k].length < CHUNK_MAX) key = k;
    }
  });
  if (key === null) key = prefix + (maxIdx + 1);
  var arr = (chunks[key] || []).concat([rec]);
  $('save').disabled = true;
  store.set(key, JSON.stringify(arr), function (ok) {
    $('save').disabled = false;
    if (!ok) { msg('Не удалось сохранить, попробуйте ещё раз', false); return; }
    chunks[key] = arr;
    settings = { f: t.f, g: t.g, c: t.c };
    store.set('s', JSON.stringify(settings), function () {});
    var b = $('save');
    b.textContent = 'Сохранено';
    b.classList.add('done');
    msg('Рейс сохранён. Смотрите в «Мои рейсы»', true);
  });
}

function deleteTrip(key, id) {
  var arr = (chunks[key] || []).filter(function (t) { return t.i !== id; });
  var done = function (ok) {
    if (!ok) return;
    if (arr.length) chunks[key] = arr; else delete chunks[key];
    renderTrips();
  };
  if (arr.length) store.set(key, JSON.stringify(arr), done); else store.remove(key, done);
}

function askDelete(key, id) {
  if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
    tg.showConfirm('Удалить этот рейс?', function (yes) { if (yes) deleteTrip(key, id); });
  } else if (confirm('Удалить этот рейс?')) {
    deleteTrip(key, id);
  }
}

function periodRange(p) {
  var now = new Date(), today = ymd(now), from = '0000-00-00', label = 'Все сохранённые рейсы';
  if (p === 'week') {
    var dow = (now.getDay() + 6) % 7;
    var s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
    var e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6);
    from = ymd(s);
    label = s.getDate() + ' ' + MON[s.getMonth()] + ' – ' + e.getDate() + ' ' + MON[e.getMonth()];
  } else if (p === 'month') {
    from = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-01';
    label = MONF[now.getMonth()] + ' ' + now.getFullYear();
  } else if (p === 'year') {
    from = now.getFullYear() + '-01-01';
    label = String(now.getFullYear());
  }
  return { from: from, label: label, today: today };
}

var CIRC = 2 * Math.PI * 70;

function renderTrips() {
  var rg = periodRange(period);
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-p') === period); });
  $('psub').textContent = rg.label;
  var items = allTrips().filter(function (p) { return p.t.d >= rg.from; });
  var gross = 0, fuel = 0, comp = 0, oth = 0, miles = 0;
  items.forEach(function (p) {
    var r = calcTrip(p.t);
    gross += r.gross; fuel += r.fuel; comp += r.comp; oth += r.other; miles += r.miles;
  });
  var costs = fuel + comp + oth, profit = gross - costs;
  var base = Math.max(gross, costs);
  var vals = [Math.max(profit, 0), fuel, comp, oth], cum = 0;
  for (var i = 0; i < 4; i++) {
    var len = base > 0 ? vals[i] / base * CIRC : 0, el = $('s' + i);
    el.setAttribute('stroke-dasharray', len + ' ' + (CIRC - len));
    el.setAttribute('stroke-dashoffset', -cum);
    cum += len;
    $('l' + i).textContent = money(i === 0 ? profit : vals[i]);
  }
  $('gross').textContent = money(gross);
  $('trips').textContent = items.length + ' ' + plural(items.length);
  $('mx').textContent = money(costs);
  $('mp').textContent = money(profit);
  $('mp').style.color = profit < 0 ? 'var(--red2)' : 'var(--mint)';
  $('mm').textContent = Math.round(miles).toLocaleString('en-US');

  var list = $('list');
  list.innerHTML = '';
  if (!items.length) {
    var em = document.createElement('div');
    em.className = 'empty';
    em.textContent = 'За этот период рейсов пока нет. Посчитайте рейс в калькуляторе и нажмите «Сохранить рейс».';
    list.appendChild(em);
    return;
  }
  items.forEach(function (p) {
    var r = calcTrip(p.t), dd = p.t.d.split('-');
    var row = document.createElement('div');
    row.className = 'trip';
    var d1 = document.createElement('div');
    d1.className = 'dt';
    d1.textContent = parseInt(dd[2], 10) + ' ' + MON[parseInt(dd[1], 10) - 1];
    var mid = document.createElement('div');
    mid.className = 'mid';
    var l1 = document.createElement('div');
    l1.className = 'l1';
    l1.textContent = routeText(p.t);
    var l2 = document.createElement('div');
    l2.className = 'l2';
    l2.textContent = Math.round(r.miles) + ' миль · Gross ' + money(r.gross);
    mid.appendChild(l1);
    mid.appendChild(l2);
    var pf = document.createElement('div');
    pf.className = 'pf';
    pf.textContent = money(r.profit);
    pf.style.color = r.profit < 0 ? 'var(--red2)' : 'var(--mint)';
    var del = document.createElement('button');
    del.className = 'del';
    del.setAttribute('aria-label', 'Удалить рейс');
    del.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>';
    del.onclick = function () { askDelete(p.k, p.t.i); };
    row.appendChild(d1);
    row.appendChild(mid);
    row.appendChild(pf);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function show(which) {
  var calc = which === 'calc';
  $('scrCalc').hidden = !calc;
  $('scrTrips').hidden = calc;
  $('nCalc').classList.toggle('on', calc);
  $('nTrips').classList.toggle('on', !calc);
  if (!calc) renderTrips();
  window.scrollTo(0, 0);
}

function fillDefaults() {
  $('dt').value = ymd(new Date());
  $('dt').max = ymd(new Date());
  if (settings.f) $('fp').value = settings.f;
  if (settings.g) $('mg').value = settings.g;
  if (settings.c !== undefined && settings.c !== null) $('cp').value = settings.c;
  calcForm();
}

STATES.forEach(function (s) {
  ['pu', 'de'].forEach(function (id) {
    var o = document.createElement('option');
    o.value = s;
    o.textContent = s;
    $(id).appendChild(o);
  });
});
['pu', 'de'].forEach(function (id) { $(id).addEventListener('change', markDirty); });
$('minus').onclick = function () { setStops(stops - 1); markDirty(); };
$('plus').onclick = function () { setStops(stops + 1); markDirty(); };

['dt', 'lm', 'dm', 'lr', 'fp', 'mg', 'cp', 'ex'].forEach(function (id) {
  $(id).addEventListener('input', function () { calcForm(); markDirty(); });
});
$('save').onclick = saveTrip;
$('clr').onclick = function () {
  ['lm', 'dm', 'lr', 'ex'].forEach(function (id) { $(id).value = ''; });
  $('pu').value = '';
  $('de').value = '';
  setStops(0);
  $('dt').value = ymd(new Date());
  calcForm();
  markDirty();
};
$('nCalc').onclick = function () { show('calc'); };
$('nTrips').onclick = function () { show('trips'); };
document.querySelectorAll('.tab').forEach(function (b) {
  b.onclick = function () { period = b.getAttribute('data-p'); renderTrips(); };
});

store.getAll(function (all) {
  Object.keys(all).forEach(function (k) {
    try {
      if (k.indexOf('m_') === 0) chunks[k] = JSON.parse(all[k]) || [];
      else if (k === 's') settings = JSON.parse(all[k]) || {};
    } catch (e) {}
  });
  fillDefaults();
});
fillDefaults();
</script>
</body>
</html>
